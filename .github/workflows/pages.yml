name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The site calls the Worker, so deploy the Worker first. A site with routes
  # that the Worker does not have yet fails (e.g. `/extract`).
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          # A Cloudflare API token from the "Edit Cloudflare Workers" template.
          # The account id is in `worker/wrangler.toml`. The OpenRouter key is
          # a Worker secret and a deploy keeps it.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4.160.1"
          command: deploy
  build:
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # The Worker URL. Set it as a repository variable (not a secret).
          VITE_DECIDE_URL: ${{ vars.DECIDE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
